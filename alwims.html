<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Point Heist</title>
<style>
    body {
        font-family: 'Courier New', monospace;
        background-color: #1a1a1a;
        color: #f0f0f0;
        text-align: center;
        padding: 50px;
        margin: 0;
    }
    h1 {
        font-size: 3em;
        color: #ff4500;
        text-shadow: 2px 2px 4px #000000;
    }
    .scroll-instruction {
        font-size: 1.5em;
        margin-bottom: 250px; /* Forces scrolling */
        color: #aaaaaa;
    }
    .content-container {
        background-color: #2a2a2a;
        padding: 30px;
        border-radius: 15px;
        display: inline-block;
        box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        margin-bottom: 40px;
    }
    .profile-pic {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
        border: 3px solid #ff4500;
    }
    .follow-text {
        font-size: 2em;
        margin-top: 20px;
        color: #00ff00;
        font-weight: bold;
    }
    
    /* New Upload Section Styles */
    .upload-section {
        margin-top: 50px;
        padding: 20px;
        border-top: 2px dashed #444;
    }
    .upload-section h2 {
        color: #ff4500;
    }
    
    /* Hide the ugly default file input and style a custom button */
    input[type="file"] {
        display: none;
    }
    .custom-upload-btn {
        background-color: #ff4500;
        color: white;
        padding: 15px 30px;
        font-size: 1.2em;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        display: inline-block;
        transition: background-color 0.3s;
    }
    .custom-upload-btn:hover {
        background-color: #cc3700;
    }

    /* The Feed where images appear */
    #image-feed {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin-top: 30px;
    }
    .feed-image {
        max-width: 80%;
        border-radius: 10px;
        border: 2px solid #555;
        box-shadow: 0 5px 15px rgba(0,0,0,0.8);
    }
</style>
</head>
<body>

    <h1>hi I am alwin im taking all your aura point</h1>
    
    <p class="scroll-instruction">↓ Slide down for more ↓</p>
    
    <div class="content-container">
        <img src="1000028031.jpg" alt="Alwin with headphones" class="profile-pic">
        <p class="follow-text">Follow stoopwrks</p>
    </div>

    <div class="upload-section">
        <h2>Drop More Aura Here</h2>
        <label for="file-upload" class="custom-upload-btn">
            + Upload Image
        </label>
        <input id="file-upload" type="file" accept="image/*" />
        
        <div id="image-feed">
            </div>
    </div>

<script>
    // Grab the input and the feed container
    const fileUpload = document.getElementById('file-upload');
    const imageFeed = document.getElementById('image-feed');

    // Listen for when a user selects a file
    fileUpload.addEventListener('change', function(event) {
        const file = event.target.files[0];
        
        if (file) {
            // Create a temporary URL for the image
            const imageUrl = URL.createObjectURL(file);
            
            // Create a new image element
            const newImg = document.createElement('img');
            newImg.src = imageUrl;
            newImg.classList.add('feed-image'); // Apply CSS styling
            
            // Add the new image to the top of the feed
            imageFeed.prepend(newImg);
        }
    });
</script>

</body>
</html>
