name: Build Android App (APK & AAB)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Locate Project and Build
        run: |
          # 1. Automatically extract any uploaded zip files
          shopt -s nullglob
          for f in *.zip */*.zip **/*.zip; do
            if [ -f "$f" ]; then
              echo "Extracting archive: $f"
              unzip -o "$f" || true
            fi
          done

          # 2. Locate the folder containing settings.gradle or build.gradle
          PROJECT_FILE=$(find . -name "settings.gradle*" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find . -name "build.gradle*" | head -n 1)
          fi

          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_DIR=$(dirname "$PROJECT_FILE")
            echo "Found Android project at: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          else
            echo "ERROR: Could not find settings.gradle.kts or build.gradle.kts."
            echo "Repository file structure:"
            find . -maxdepth 3
            exit 1
          fi

          # 3. Build AAB and APK
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew bundleDebug assembleDebug --stacktrace
          else
            gradle bundleDebug assembleDebug --stacktrace
          fi

      - name: Upload AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: EventFlow-App-Bundle-AAB
          path: "**/build/outputs/bundle/**/*.aab"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EventFlow-App-APK
          path: "**/build/outputs/apk/**/*.apk"

          
          
          
