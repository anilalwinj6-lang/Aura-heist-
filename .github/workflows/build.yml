name: Build Android App (APK & AAB)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK and AAB
        run: |
          # If files are inside an EventFlow subfolder, move into it
          if [ -d "EventFlow" ]; then
            cd EventFlow
          fi

          # If gradlew was not uploaded, generate it automatically
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi

          chmod +x gradlew
          ./gradlew bundleDebug assembleDebug --stacktrace

      - name: Upload AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: EventFlow-App-Bundle-AAB
          path: "**/build/outputs/bundle/**/*.aab"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EventFlow-App-APK
          path: "**/build/outputs/apk/**/*.apk"
          
          
